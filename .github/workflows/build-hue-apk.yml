name: Build NuvioTV Hue APK

on:
  workflow_dispatch:
  push:
    branches: [ "dev", "main" ]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout NuvioTV Source
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Configure local.properties (Disable C++ NDK flags & set client config)
        run: |
          echo "USE_LOCAL_FFMPEG_DECODER=false" > local.properties
          echo "DOVI_NATIVE_ENABLED=false" >> local.properties
          echo "DOVI_EXTRACTOR_HOOK_READY=false" >> local.properties
          echo "DOVI_ENABLE_REAL_LINK=false" >> local.properties
          echo "" | base64 -d >> local.properties
          cp local.properties local.dev.properties
          echo "org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8" >> gradle.properties

      - name: Prepare CI signing config
        run: |
          keytool -genkeypair \
            -v \
            -keystore "$RUNNER_TEMP/ci-debug.jks" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

          {
            echo "NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/ci-debug.jks"
            echo "NUVIO_RELEASE_KEY_ALIAS=androiddebugkey"
            echo "NUVIO_RELEASE_KEY_PASSWORD=android"
            echo "NUVIO_RELEASE_STORE_PASSWORD=android"
          } >> "$GITHUB_ENV"

      - name: Build Full Debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleFullDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/full/debug/app-full-armeabi-v7a-debug.apk app/build/outputs/apk/full/debug/NuvioTV-Hue-Sync-armeabi-v7a.apk
          cp app/build/outputs/apk/full/debug/app-full-arm64-v8a-debug.apk app/build/outputs/apk/full/debug/NuvioTV-Hue-Sync-arm64-v8a.apk
          cp app/build/outputs/apk/full/debug/app-full-universal-debug.apk app/build/outputs/apk/full/debug/NuvioTV-Hue-Sync-Universal.apk

      - name: Upload Compiled Nuvio Hue APK
        uses: actions/upload-artifact@v4
        with:
          name: NuvioTV-Hue-Sync-APK
          path: app/build/outputs/apk/full/debug/NuvioTV-Hue-Sync-*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-hue-sync
          name: "NuvioTV + Philips Hue Screen Sync (On-Screen Settings)"
          body: |
            ### NuvioTV with Native Philips Hue Screen Sync & On-Screen Settings Menu
            - **Google TV Stick (32-bit ARM):** Download `NuvioTV-Hue-Sync-armeabi-v7a.apk`
            - **64-bit Android TV (`arm64-v8a`):** Download `NuvioTV-Hue-Sync-arm64-v8a.apk`
            - **Universal APK (All ABIs):** Download `NuvioTV-Hue-Sync-Universal.apk`

            #### Features
            - Real-time 3-zone (Left / Center / Right) Philips Hue Ambilight screen sync during video & trailer playback
            - Automatic Hue Bridge discovery on any home Wi-Fi network (with one-click pairing)
            - On-screen Hue Sync Settings menu accessible from the video player control bar (`⚙` button next to Sources), top-right `Hue Sync` pill (`UP` twice), or **Settings → Playback / Video**
            - Live remote adjustment for Max Brightness, Min Brightness, Color Saturation, Sync Speed, and per-bulb Zone Assignment
          files: |
            app/build/outputs/apk/full/debug/NuvioTV-Hue-Sync-armeabi-v7a.apk
            app/build/outputs/apk/full/debug/NuvioTV-Hue-Sync-arm64-v8a.apk
            app/build/outputs/apk/full/debug/NuvioTV-Hue-Sync-Universal.apk
          prerelease: false
          make_latest: true
