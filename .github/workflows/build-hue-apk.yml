name: Build NuvioTV Hue APK

on:
  workflow_dispatch:
  push:
    branches: [ "dev", "main" ]

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout NuvioTV Source
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Configure local.properties (Disable C++ NDK flags)
        run: |
          cp local.example.properties local.properties || touch local.properties
          touch local.dev.properties
          echo "" >> local.properties
          echo "USE_LOCAL_FFMPEG_DECODER=false" >> local.properties
          echo "DOVI_NATIVE_ENABLED=false" >> local.properties
          echo "DOVI_EXTRACTOR_HOOK_READY=false" >> local.properties
          echo "DOVI_ENABLE_REAL_LINK=false" >> local.properties
          echo "org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8" >> gradle.properties

      - name: Prepare CI signing config
        run: |
          keytool -genkeypair \
            -v \
            -keystore "$RUNNER_TEMP/ci-debug.jks" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

          {
            echo "NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/ci-debug.jks"
            echo "NUVIO_RELEASE_KEY_ALIAS=androiddebugkey"
            echo "NUVIO_RELEASE_KEY_PASSWORD=android"
            echo "NUVIO_RELEASE_STORE_PASSWORD=android"
          } >> "$GITHUB_ENV"

      - name: Build Full Debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleFullDebug --no-daemon --stacktrace

      - name: Upload Compiled Nuvio Hue APK
        uses: actions/upload-artifact@v4
        with:
          name: NuvioTV-Hue-Switch-APK
          path: app/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
