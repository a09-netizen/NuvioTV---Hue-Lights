name: Build NuvioTV Hue APK

on:
  workflow_dispatch:
  push:
    branches: [ "dev", "main" ]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout NuvioTV Source
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Configure local.properties (Disable C++ NDK flags & set client config)
        run: |
          echo "USE_LOCAL_FFMPEG_DECODER=false" > local.properties
          echo "DOVI_NATIVE_ENABLED=false" >> local.properties
          echo "DOVI_EXTRACTOR_HOOK_READY=false" >> local.properties
          echo "DOVI_ENABLE_REAL_LINK=false" >> local.properties
          echo "" | base64 -d >> local.properties
          cp local.properties local.dev.properties
          echo "org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8" >> gradle.properties

      - name: Restore Persistent Signing Keystore (for in-place APK upgrades)
        run: |
          echo "" | base64 -d > "$RUNNER_TEMP/ci-debug.jks"
          {
            echo "NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/ci-debug.jks"
            echo "NUVIO_RELEASE_KEY_ALIAS=androiddebugkey"
            echo "NUVIO_RELEASE_KEY_PASSWORD=android"
            echo "NUVIO_RELEASE_STORE_PASSWORD=android"
          } >> "$GITHUB_ENV"

      - name: Extract App Version
        id: version
        run: |
          VER_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          VER_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts)
          echo "version_name=$VER_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VER_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER_NAME" >> "$GITHUB_OUTPUT"

      - name: Build Full Debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleFullDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/full/debug/app-full-armeabi-v7a-debug.apk app/build/outputs/apk/full/debug/NuvioTV-Hue-Sync-armeabi-v7a.apk
          cp app/build/outputs/apk/full/debug/app-full-arm64-v8a-debug.apk app/build/outputs/apk/full/debug/NuvioTV-Hue-Sync-arm64-v8a.apk
          cp app/build/outputs/apk/full/debug/app-full-universal-debug.apk app/build/outputs/apk/full/debug/NuvioTV-Hue-Sync-Universal.apk

      - name: Upload Compiled Nuvio Hue APK
        uses: actions/upload-artifact@v4
        with:
          name: NuvioTV-Hue-Sync-APK-${{ steps.version.outputs.tag }}
          path: app/build/outputs/apk/full/debug/NuvioTV-Hue-Sync-*.apk
          if-no-files-found: error

      - name: Publish Versioned GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "NuvioTV Ambient Light Sync ${{ steps.version.outputs.tag }} (Build ${{ steps.version.outputs.version_code }})"
          body_path: CHANGELOG.md
          files: |
            app/build/outputs/apk/full/debug/NuvioTV-Hue-Sync-armeabi-v7a.apk
            app/build/outputs/apk/full/debug/NuvioTV-Hue-Sync-arm64-v8a.apk
            app/build/outputs/apk/full/debug/NuvioTV-Hue-Sync-Universal.apk
          prerelease: false
          make_latest: true
